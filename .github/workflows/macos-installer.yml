name: macOS installer
on:
  workflow_dispatch:
  push:
    tags:
      - 'finance-test-*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(startsWith(github.ref_name, 'finance-test-intel-') && '[{"runner":"macos-15-intel","arch":"x86_64"}]' || '[{"runner":"macos-15","arch":"arm64"},{"runner":"macos-15-intel","arch":"x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the installer
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          bash prototype/build-macos.sh
      - name: Install the package
        run: |
          set -o pipefail
          sudo /usr/sbin/installer -pkg prototype/dist/FinanceArchive.pkg -target / 2>&1 | tee "${RUNNER_TEMP}/finance-install.log"
      - name: Launch the installed app
        run: |
          set -o pipefail
          prototype/.venv/bin/python - <<'PY' 2>&1 | tee "${RUNNER_TEMP}/finance-launch.log"
          from os import environ
          from subprocess import Popen, PIPE, STDOUT, TimeoutExpired, run

          binary = "/Applications/FinanceArchive.app/Contents/MacOS/FinanceArchive"
          diagnostics = []
          for platform in ("offscreen", "cocoa"):
              try:
                  with Popen([binary], env={**environ, "QT_QPA_PLATFORM": platform},
                             stdout=PIPE, stderr=STDOUT, text=True, errors="replace") as app:
                      try:
                          output, _ = app.communicate(timeout=8)
                      except TimeoutExpired:
                          app.terminate()
                          try:
                              app.communicate(timeout=15)
                          except TimeoutExpired:
                              app.kill()
                              app.communicate()
                          print(f"App stayed open using {platform}.")
                          break
                      diagnostics.append(f"{platform}: exit {app.returncode}. {output[-1100:]}")
              except OSError as exc:
                  diagnostics.append(f"{platform}: {exc}")
          else:
              signature = run(["/usr/bin/codesign", "--verify", "--deep", "--strict", binary],
                              capture_output=True, text=True).stderr
              message = " ".join((*diagnostics, signature)).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=FinanceArchive startup::{message}")
              raise SystemExit(1)
          PY
      - name: Run archive tests
        run: |
          set -o pipefail
          prototype/.venv/bin/python -m unittest discover -s prototype -v 2>&1 | tee "${RUNNER_TEMP}/finance-tests.log"
      - name: Upload the local test installer
        uses: actions/upload-artifact@v4
        with:
          name: FinanceArchive-macOS-${{ matrix.arch }}
          path: prototype/dist/FinanceArchive.pkg
          if-no-files-found: error
      - name: Show failing stage details
        if: failure()
        run: |
          for log in "${RUNNER_TEMP}"/finance-*.log; do
            if test -f "$log"; then
              { printf '### %s\n\n```text\n' "$(basename "$log")"; tail -55 "$log"; printf '```\n\n'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
